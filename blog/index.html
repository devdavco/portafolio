<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog - David Corrales</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <script>
    // Aplica el tema guardado (o el del sistema) antes de pintar, para evitar parpadeos.
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">

        <a href="/#proyectos">Proyectos</a>
        <a href="/blog/" aria-current="page">Blog</a>
        <a href="/#contacto">Contacto</a>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar a tema claro" hidden>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </header>

  <main>
    <section class="section blog-section" aria-labelledby="blog-heading">
      <h1 id="blog-heading">Blog</h1>
      <ul class="post-list">
        <li>

  <footer class="site-footer">

  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
